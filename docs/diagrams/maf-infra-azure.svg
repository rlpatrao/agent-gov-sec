<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="Helvetica, Arial, sans-serif">
  <style>
    .title   { font-size:20px; font-weight:700; fill:#263238; }
    .titsub  { font-size:11.5px; fill:#78909c; }
    .acct    { fill:#fbfdff; stroke:#90a4ae; stroke-width:1.5; stroke-dasharray:7 5; }
    .acct-l  { font-size:12px; font-weight:700; fill:#546e7a; }
    .agent   { fill:#e3f2fd; stroke:#0078d4; stroke-width:2; }
    .choke   { fill:#e5f4fb; stroke:#0078d4; stroke-width:2; }
    .svc     { fill:#eceff4; stroke:#607d8b; stroke-width:1.5; }
    .opt     { fill:#f7f9fa; stroke:#90a4ae; stroke-width:1.5; stroke-dasharray:5 4; }
    .b-t     { font-size:13px; font-weight:700; fill:#1a2b3a; }
    .b-t.ch  { fill:#005a9e; }
    .b-s     { font-size:10px; fill:#546e7a; }
    .flow    { font-size:10px; font-weight:600; fill:#37474f; }
    .bus-l   { font-size:10.5px; font-weight:600; fill:#546e7a; }
    .note    { font-size:10.5px; fill:#78909c; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#0078d4"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#90a4ae"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#ffffff"/>
  <text class="title" x="40" y="32">Agent-Gov-Sec — Azure Infrastructure · Method 2: Microsoft Agent Framework (in-process governance middleware)</text>
  <text class="titsub" x="40" y="52">The MAF agent owns the OTel TracerProvider; guards run in-process as middleware. Authorization is in-process middleware — there is no managed policy engine on Azure.</text>

  <!-- Azure subscription boundary -->
  <rect class="acct" x="22" y="68" width="1196" height="472" rx="16"/>
  <text class="acct-l" x="42" y="90">Azure subscription &lt;SUBSCRIPTION_ID&gt; · resource group galaxy-rg · tag project = galaxy-rp</text>

  <!-- ── Governed in-process path lane ── -->
  <rect class="agent" x="44" y="110" width="300" height="106" rx="10"/>
  <text class="b-t" x="58" y="134">MAF Agent (per persona)</text>
  <text class="b-s" x="58" y="154">galaxy_finops · galaxy_auditor · galaxy_rogue</text>
  <text class="b-s" x="58" y="171">Container Apps / Foundry Agent Service</text>
  <text class="b-s" x="58" y="188">Microsoft Agent Framework runtime</text>
  <text class="b-s" x="58" y="205">MI galaxy-&lt;persona&gt;-mi · Entra caller</text>

  <rect class="choke" x="448" y="124" width="196" height="84" rx="10"/>
  <text class="b-t ch" x="462" y="147">Guard middleware</text>
  <text class="b-s" x="462" y="167">in-process, before model call</text>
  <text class="b-s" x="462" y="183">prompt-injection · credential</text>
  <text class="b-s" x="462" y="199">context-budget</text>

  <rect class="choke" x="724" y="124" width="206" height="84" rx="10"/>
  <text class="b-t ch" x="738" y="147">Policy middleware</text>
  <text class="b-s" x="738" y="167">policy · capability · rogue</text>
  <text class="b-s" x="738" y="183">permit / forbid per agent × tool</text>
  <text class="b-s" x="738" y="199">in-process, fail-closed</text>

  <rect class="choke" x="1010" y="124" width="190" height="84" rx="10"/>
  <text class="b-t ch" x="1024" y="147">Model call</text>
  <text class="b-s" x="1024" y="167">Azure OpenAI gpt-4o</text>
  <text class="b-s" x="1024" y="183">then output redaction</text>
  <text class="b-s" x="1024" y="199">PII redaction on the result</text>

  <!-- path arrows + labels -->
  <g stroke="#0078d4" stroke-width="2" marker-end="url(#a)">
    <line x1="344" y1="166" x2="446" y2="166"/>
    <line x1="644" y1="166" x2="722" y2="166"/>
    <line x1="930" y1="166" x2="1008" y2="166"/>
  </g>
  <text class="flow" x="395" y="156" text-anchor="middle">before_model</text>
  <text class="flow" x="683" y="160" text-anchor="middle">content ok</text>
  <text class="flow" x="969" y="160" text-anchor="middle">permit</text>

  <text class="note" x="44" y="238">Default-deny: a tool not in the agent's allow-list is refused in-process (e.g. Rogue → query_billing). Every guard runs inside the agent process; no external gateway or managed authorization service sits on this path.</text>

  <!-- ── Service bus ── -->
  <text class="bus-l" x="44" y="266">MAF agent ↔ Azure services (per-agent identity; same governance library as the APIM-proxy tier — trust-but-verify)</text>
  <line x1="194" y1="216" x2="194" y2="282" stroke="#90a4ae" stroke-width="2"/>
  <line x1="152" y1="282" x2="1092" y2="282" stroke="#90a4ae" stroke-width="2"/>
  <g stroke="#90a4ae" stroke-width="2" marker-end="url(#ag)">
    <line x1="152"  y1="282" x2="152"  y2="302"/>
    <line x1="387"  y1="282" x2="387"  y2="302"/>
    <line x1="622"  y1="282" x2="622"  y2="302"/>
    <line x1="857"  y1="282" x2="857"  y2="302"/>
    <line x1="1092" y1="282" x2="1092" y2="302"/>
  </g>

  <!-- Service boxes -->
  <rect class="svc" x="44"    y="304" width="216" height="120" rx="10"/>
  <text class="b-t" x="58" y="328">Entra Managed Identity</text>
  <text class="b-s" x="58" y="349">galaxy-&lt;persona&gt;-mi</text>
  <text class="b-s" x="58" y="366">galaxy-finops-mi / -auditor-mi</text>
  <text class="b-s" x="58" y="383">galaxy-rogue-mi</text>
  <text class="b-s" x="58" y="400">NHI → Entra managed identity</text>

  <rect class="svc" x="278.8" y="304" width="216" height="120" rx="10"/>
  <text class="b-t" x="293" y="328">Key Vault</text>
  <text class="b-s" x="293" y="349">azure-openai-key</text>
  <text class="b-s" x="293" y="366">MI access via RBAC</text>
  <text class="b-s" x="293" y="383">5-min TTL cache</text>
  <text class="b-s" x="293" y="400">env fallback offline</text>

  <rect class="svc" x="513.6" y="304" width="216" height="120" rx="10"/>
  <text class="b-t" x="528" y="328">PostgreSQL Flexible Server</text>
  <text class="b-s" x="528" y="349">trace_ledger (shared)</text>
  <text class="b-s" x="528" y="366">PK run_id · SK entry_seq</text>
  <text class="b-s" x="528" y="383">SHA-256 hash chain</text>
  <text class="b-s" x="528" y="400">append-only writes</text>

  <rect class="opt" x="748.4" y="304" width="216" height="120" rx="10"/>
  <text class="b-t" x="762" y="328">Application Insights</text>
  <text class="b-s" x="762" y="349">OTel gen_ai.* spans</text>
  <text class="b-s" x="762" y="366">→ Azure Monitor</text>
  <text class="b-s" x="762" y="383">MAF owns the TracerProvider</text>
  <text class="b-s" x="762" y="400">optional — no-op if unset</text>

  <rect class="svc" x="983.2" y="304" width="216" height="120" rx="10"/>
  <text class="b-t" x="997" y="328">Azure OpenAI</text>
  <text class="b-s" x="997" y="349">galaxy-&lt;suffix&gt;-aoai</text>
  <text class="b-s" x="997" y="366">deployment gpt-4o</text>
  <text class="b-s" x="997" y="383">key from Key Vault</text>
  <text class="b-s" x="997" y="400">reached via model call</text>

  <!-- footer notes -->
  <text class="note" x="44" y="450">Division of labor: the policy/capability/rogue middleware does coarse authorization (which tool, which recipient); the guard middleware does content controls (injection,</text>
  <text class="note" x="44" y="466">credential, context-budget, PII redaction). Both run in-process inside the MAF agent — there is no managed Cedar policy engine on Azure.</text>
  <text class="note" x="44" y="488">Provisioning: cloud_adapters/azure infra provisions identity, Key Vault, PostgreSQL, and Application Insights; the agent runs on Container Apps or Foundry Agent Service.</text>
  <text class="note" x="44" y="514">Legend:  blue = governed in-process path (guards + policy middleware)  ·  light-blue = MAF agent (NHI)  ·  grey = Azure service  ·  dashed = optional (observability).</text>
  <text class="note" x="44" y="534">Scope: Method 2 (Microsoft Agent Framework). Method 1 (APIM proxy) is provisioned separately — see the Method 1 infrastructure diagram (arch-infra-azure.svg).</text>
</svg>
