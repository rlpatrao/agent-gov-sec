<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="Helvetica, Arial, sans-serif">
  <style>
    .title   { font-size:20px; font-weight:700; fill:#263238; }
    .titsub  { font-size:11.5px; fill:#78909c; }
    .acct    { fill:#fbfdff; stroke:#90a4ae; stroke-width:1.5; stroke-dasharray:7 5; }
    .acct-l  { font-size:12px; font-weight:700; fill:#546e7a; }
    .agent   { fill:#e3f2fd; stroke:#1565c0; stroke-width:2; }
    .choke   { fill:#fff3e0; stroke:#ef6c00; stroke-width:2; }
    .svc     { fill:#eceff4; stroke:#607d8b; stroke-width:1.5; }
    .opt     { fill:#f7f9fa; stroke:#90a4ae; stroke-width:1.5; stroke-dasharray:5 4; }
    .b-t     { font-size:13px; font-weight:700; fill:#1a2b3a; }
    .b-t.ch  { fill:#bf360c; }
    .b-s     { font-size:10px; fill:#546e7a; }
    .flow    { font-size:10px; font-weight:600; fill:#37474f; }
    .bus-l   { font-size:10.5px; font-weight:600; fill:#546e7a; }
    .note    { font-size:10.5px; fill:#78909c; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#ef6c00"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#90a4ae"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#ffffff"/>
  <text class="title" x="40" y="32">Agent-Gov-Sec — AWS Infrastructure · Method 2: AgentCore (Cedar authz + content interceptors)</text>
  <text class="titsub" x="40" y="52">Provisioned by scripts/deploy_agentcore.py — live on us-east-2. The runtime reaches tools only through the MCP gateway, where interceptors run content controls and Cedar authorizes.</text>

  <!-- AWS account boundary -->
  <rect class="acct" x="22" y="68" width="1196" height="472" rx="16"/>
  <text class="acct-l" x="42" y="90">AWS account &lt;ACCOUNT_ID&gt; · region us-east-2 · provider default_tags project = galaxy-rp</text>

  <!-- ── Governed MCP path lane ── -->
  <rect class="agent" x="44" y="110" width="300" height="106" rx="10"/>
  <text class="b-t" x="58" y="134">AgentCore Runtime (per persona)</text>
  <text class="b-s" x="58" y="154">galaxy_finops · galaxy_auditor · galaxy_rogue</text>
  <text class="b-s" x="58" y="171">runtime_agent.py · PYTHON_3_12</text>
  <text class="b-s" x="58" y="188">role galaxy-rp-&lt;type&gt; · SigV4 caller</text>
  <text class="b-s" x="58" y="205">code in S3 galaxy-agentcore-runtime-…</text>

  <rect class="choke" x="448" y="124" width="196" height="84" rx="10"/>
  <text class="b-t ch" x="462" y="147">MCP Gateway</text>
  <text class="b-s" x="462" y="167">galaxy-governance-gw · AWS_IAM</text>
  <text class="b-s" x="462" y="183">req interceptor galaxy-gov-request</text>
  <text class="b-s" x="462" y="199">injection · credential · blocked-pat</text>

  <rect class="choke" x="724" y="124" width="206" height="84" rx="10"/>
  <text class="b-t ch" x="738" y="147">Cedar policy engine</text>
  <text class="b-s" x="738" y="167">galaxy_governance · ENFORCE</text>
  <text class="b-s" x="738" y="183">permit / forbid per agent × tool</text>
  <text class="b-s" x="738" y="199">9 policies (3 agents × 3 tools)</text>

  <rect class="choke" x="1010" y="124" width="190" height="84" rx="10"/>
  <text class="b-t ch" x="1024" y="147">Tool Lambda</text>
  <text class="b-s" x="1024" y="167">galaxy-tools (3 tools)</text>
  <text class="b-s" x="1024" y="183">resp interceptor galaxy-gov-response</text>
  <text class="b-s" x="1024" y="199">PII redaction on the result</text>

  <!-- path arrows + labels -->
  <g stroke="#ef6c00" stroke-width="2" marker-end="url(#a)">
    <line x1="344" y1="166" x2="446" y2="166"/>
    <line x1="644" y1="166" x2="722" y2="166"/>
    <line x1="930" y1="166" x2="1008" y2="166"/>
  </g>
  <text class="flow" x="395" y="156" text-anchor="middle">SigV4 tools/call</text>
  <text class="flow" x="683" y="160" text-anchor="middle">content ok</text>
  <text class="flow" x="969" y="160" text-anchor="middle">permit</text>

  <text class="note" x="44" y="238">Forbid wins / default-deny: a tool not in the agent's allow-list is denied with an MCP error (e.g. Rogue → query_billing). The runtime signs every call; the gateway resolves the principal as assumed-role/galaxy-rp-&lt;type&gt;.</text>

  <!-- ── Service bus ── -->
  <text class="bus-l" x="44" y="266">AgentCore control plane ↔ AWS services (per-agent identity; same governance library as the in-process tier — trust-but-verify)</text>
  <line x1="194" y1="216" x2="194" y2="282" stroke="#90a4ae" stroke-width="2"/>
  <line x1="152" y1="282" x2="1092" y2="282" stroke="#90a4ae" stroke-width="2"/>
  <g stroke="#90a4ae" stroke-width="2" marker-end="url(#ag)">
    <line x1="152"  y1="282" x2="152"  y2="302"/>
    <line x1="387"  y1="282" x2="387"  y2="302"/>
    <line x1="622"  y1="282" x2="622"  y2="302"/>
    <line x1="857"  y1="282" x2="857"  y2="302"/>
    <line x1="1092" y1="282" x2="1092" y2="302"/>
  </g>

  <!-- Service boxes -->
  <rect class="svc" x="44"    y="304" width="216" height="120" rx="10"/>
  <text class="b-t" x="58" y="328">IAM + STS</text>
  <text class="b-s" x="58" y="349">roles galaxy-rp-&lt;type&gt;</text>
  <text class="b-s" x="58" y="366">galaxy-agentcore-gateway</text>
  <text class="b-s" x="58" y="383">galaxy-tool-lambda</text>
  <text class="b-s" x="58" y="400">STS AssumeRole · least-priv</text>

  <rect class="svc" x="278.8" y="304" width="216" height="120" rx="10"/>
  <text class="b-t" x="293" y="328">AgentCore Identity</text>
  <text class="b-s" x="293" y="349">workload identities</text>
  <text class="b-s" x="293" y="366">galaxy_finops / _auditor / _rogue</text>
  <text class="b-s" x="293" y="383">NHI → AgentCore Identity</text>
  <text class="b-s" x="293" y="400">binds the SigV4 principal</text>

  <rect class="svc" x="513.6" y="304" width="216" height="120" rx="10"/>
  <text class="b-t" x="528" y="328">DynamoDB</text>
  <text class="b-s" x="528" y="349">galaxy-trace-ledger (shared)</text>
  <text class="b-s" x="528" y="366">PK run_id · SK entry_seq</text>
  <text class="b-s" x="528" y="383">SHA-256 hash chain</text>
  <text class="b-s" x="528" y="400">append-only writes</text>

  <rect class="opt" x="748.4" y="304" width="216" height="120" rx="10"/>
  <text class="b-t" x="762" y="328">CloudWatch GenAI Obs.</text>
  <text class="b-s" x="762" y="349">AgentCore Observability</text>
  <text class="b-s" x="762" y="366">OTel spans → CloudWatch</text>
  <text class="b-s" x="762" y="383">needs Transaction Search</text>
  <text class="b-s" x="762" y="400">optional — when runtime.zip used</text>

  <rect class="svc" x="983.2" y="304" width="216" height="120" rx="10"/>
  <text class="b-t" x="997" y="328">S3</text>
  <text class="b-s" x="997" y="349">galaxy-agentcore-runtime-</text>
  <text class="b-s" x="997" y="366">&lt;acct&gt;</text>
  <text class="b-s" x="997" y="383">runtime code artifact</text>
  <text class="b-s" x="997" y="400">(runtime/agent.zip)</text>

  <!-- footer notes -->
  <text class="note" x="44" y="450">Division of labor: Cedar = coarse authorization (which tool, which recipient); the interceptor Lambdas = content controls (injection, credential, PII);</text>
  <text class="note" x="44" y="466">the data proxy = field-grained access control. The interceptors are zip Lambdas (ECR push is SCP-blocked) running governance.shared.enforcement.</text>
  <text class="note" x="44" y="488">Provisioning: scripts/deploy_agentcore.py is idempotent (IAM → MCP gateway + Cedar engine → interceptors → runtimes); --teardown reverses it.</text>
  <text class="note" x="44" y="514">Legend:  orange = governed gateway path  ·  blue = agent runtime (NHI)  ·  grey = AWS service  ·  dashed = optional (observability).</text>
  <text class="note" x="44" y="534">Scope: Method 2 (AgentCore). Method 1 (Bedrock proxy) is provisioned by cloud_adapters/aws/infra/main.tf — see the Method 1 infrastructure diagram.</text>
</svg>
