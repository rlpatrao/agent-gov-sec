[build-system]
requires = ["setuptools>=77", "wheel"]  # >=77 for PEP 639 SPDX license metadata
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-agentkit"
version = "0.1.0"
description = "Client-side SDK for building governed agents against the Galaxy governance platform."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
# LICENSE and NOTICE are the Apache-2.0 requirement; THIRD_PARTY_NOTICES.md carries
# the dependency attributions and is generated by scripts/gen_third_party_notices.py.
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# Agnostic core: MSGK governance toolkit + OTel SDK + config. No cloud SDK,
# no agent framework — those live in the per-cloud extras below.
dependencies = [
    # WS3 re-baseline: governance toolkit aligned at 3.7.0 (agent-sre exact pin released).
    "agent-os-kernel>=3.7.0,<4",
    "agent-sre>=3.7.0,<4",
    "agentmesh-platform>=3.7.0,<4",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-api>=1.27.0",
    "pydantic>=2.0.0,<3",
    "PyYAML>=6.0.1",
    # Standards-based policy engine (Cedar) for the WS7 gap modules — built in so
    # GALAXY_POLICY_ENGINE=cedar works out of the box. Evaluated via cedarpy
    # directly (MSGK 3.7.0's CedarBackend targets the cedarpy 3.x API and fails
    # open; see galaxy_gov/extensions/policy_engine.py).
    "cedarpy>=4,<5",
]

# Cloud adapters are opt-in. Install the one you target:
#   pip install '.[azure]'   (default provider; fully implemented)
#   pip install '.[aws]'     (fully implemented; AgentCore live on us-east-2)
#   pip install '.[gcp]'     (WS6 — skeleton)
[project.optional-dependencies]
# Azure cloud bindings + the Microsoft Agent Framework (MAF) glue.
azure = [
    "agent-framework-core>=1.8.1,<2",
    "agent-framework-foundry>=1.8.1",
    "azure-identity>=1.19.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b50",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "asyncpg>=0.29.0",
    "azure-mgmt-appcontainers>=3.0.0",  # Container-Apps-Jobs orchestrator (lazy-imported)
]
# WS5: boto3 (Secrets Manager/SSM/STS/Bedrock/DynamoDB/Batch) + OTLP→ADOT/X-Ray exporter.
aws = [
    "boto3>=1.34.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]
# WS6: google-auth (ADC/SA impersonation), Secret Manager, BigQuery (audit ledger),
# Vertex AI / Gemini chat models for the LangGraph axis, and the OTLP→Cloud Trace exporter.
gcp = [
    "google-auth>=2.30.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-bigquery>=3.25.0",
    "langchain-google-vertexai>=2.0",
    "langchain-google-genai>=2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]
# Framework axis: govern LangGraph agents (the non-MAF counterpart to the
# Microsoft Agent Framework glue). Cloud-orthogonal — combine with [azure]/[aws].
#   pip install '.[langgraph]'
langgraph = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
]
# Framework axis: Pydantic AI binding (minimal, typed, model-agnostic agent
# framework). Native models reuse the cloud-resolved creds; governance via the
# shared GuardPipeline wired through a model wrapper.
#   pip install '.[pydantic]'
pydantic = [
    "pydantic-ai-slim>=1.0",
]
# Deployment host: run a governed LangGraph agent inside Vertex AI Agent Engine
# (managed runtime). Combine with [gcp] and [langgraph]:
#   pip install '.[gcp,langgraph,agent-engine]'
agent-engine = [
    "google-cloud-aiplatform[agent_engines]>=1.95.0",
    "cloudpickle>=3.0",
]

# Test/dev tooling — what CI (and a contributor) needs beyond the runtime deps.
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
]

# A single console script. `galaxy init <project>` scaffolds a standalone
# governed agent project for an agent team; `new-agent`, `enroll`, `verify`, and
# `export-registry` are the platform-side tooling.
[project.scripts]
galaxy = "galaxy_gov.tooling.scaffold:main"

# The platform wheel ships only the governance platform — the agnostic core, the
# guard/enforcement library, the A2A protocol, and the cloud adapters. It does
# NOT ship payload_agents (that is example/demo code, or the consuming team's
# own repo), tests, docs, or the local-only archive.
[tool.setuptools.packages.find]
include = ["galaxy_agentkit*", "core*", "galaxy_gov*", "framework_adapters*", "cloud_adapters*"]
exclude = ["payload_agents*", "tests*", "archive*", "docs*", "scripts*", "deploy*"]

# Package data is declared explicitly, not by a blanket glob. The guards read
# these files at runtime from the installed package, and a wheel built without
# them does not fail — the prompt-injection detector falls back to sample rules
# and keeps reporting success. `galaxy_agentkit.check_install()` verifies the set,
# and CI installs the wheel into a clean venv and asserts it.
#
# Explicit rather than `"*" = ["*.yaml"]` so that cloud_adapters/*/infra — which
# is an importable package containing Terraform and its state — cannot be swept
# into the distribution.
[tool.setuptools.package-data]
galaxy_gov = ["configs/*.yaml", "policies/*.yaml"]
"galaxy_gov.shared.enforcement" = ["configs/*.yaml", "configs/*.cedar"]
"cloud_adapters.aws" = ["egress.yaml"]
"cloud_adapters.azure" = ["egress.yaml"]
"cloud_adapters.gcp" = ["egress.yaml"]
"cloud_adapters.local" = ["egress.yaml"]

[tool.pytest.ini_options]
# The repo's tests only — never recurse into the local-only archive/.
testpaths = ["tests"]
