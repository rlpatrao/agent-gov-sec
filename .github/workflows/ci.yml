# CI — the payload check (for agent developers) and the governance gate.
#
# payload-check   : what an agent developer must pass — tests + the offline
#                   conformance matrix. Fast, no cloud credentials.
# governance-gate : the platform-owner gate — full test suite + the offline
#                   matrix + a clean wheel build of the platform package.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  payload-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install (platform + LangGraph framework axis)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[langgraph]'
      - name: Tests
        run: python -m pytest -q
      - name: Offline conformance matrix
        run: python scripts/demo_agents.py --fake --extended

  governance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install (platform + build tooling)
        run: |
          python -m pip install --upgrade pip build
          # [aws] as well as [langgraph]: the third-party notices are generated
          # from the resolved [aws] closure and cannot be checked without it.
          pip install -e '.[aws,langgraph]'
      - name: Full test suite
        run: python -m pytest -q
      - name: Build the platform wheel
        run: python -m build --wheel
      - name: Third-party notices are current
        run: python scripts/gen_third_party_notices.py --check

      - name: Documentation references match the tree
        run: python scripts/check_doc_refs.py

      - name: Confirm the wheel excludes payload_agents / tests and carries its licenses
        run: |
          python - <<'PY'
          import email, glob, sys, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          zf = zipfile.ZipFile(whl)
          names = zf.namelist()

          leaked = [n for n in names if n.startswith(("payload_agents/", "tests/", "docs/"))]
          if leaked:
              print("wheel leaks non-platform files:", leaked[:10]); sys.exit(1)

          meta_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
          meta = email.message_from_string(zf.read(meta_name).decode())
          if meta.get("License-Expression") != "Apache-2.0":
              print("wheel METADATA is missing License-Expression: Apache-2.0",
                    f"(got {meta.get('License-Expression')!r})"); sys.exit(1)

          required = {"LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"}
          shipped = {n.rsplit("/", 1)[-1] for n in names if "/licenses/" in n}
          if missing := required - shipped:
              print("wheel is missing license files:", sorted(missing)); sys.exit(1)

          print(f"{whl}: platform-only, Apache-2.0, licenses bundled ({len(names)} entries)")
          PY

      - name: Wheel is usable as a client package (clean venv, outside the repo)
        run: |
          # The gate that catches a wheel built without its package data. The
          # guards read their rule files from the installed package and degrade
          # rather than fail without them, so importing is not enough — this
          # installs the wheel alone, leaves the source tree, and asserts the
          # configuration bundle is complete and the detector builds from the
          # real rules.
          python -m venv /tmp/clientenv
          /tmp/clientenv/bin/pip install --quiet --upgrade pip
          /tmp/clientenv/bin/pip install --quiet dist/*.whl
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/clientenv/bin/python -c "
          import galaxy_agentkit, sys
          sys.exit(0 if galaxy_agentkit.check_install() else 1)
          "
          # -W error::UserWarning: falling back to the toolkit's sample rules
          # emits a UserWarning, so this fails if the packaged rules are absent.
          /tmp/clientenv/bin/python -W error::UserWarning -c "
          from galaxy_gov.shared.enforcement.pipeline import _build_injection_detector
          _build_injection_detector()
          print('guard pipeline builds from packaged rules')
          "
          /tmp/clientenv/bin/galaxy init smoke-agent --root /tmp/elsewhere >/dev/null
          test -f /tmp/elsewhere/smoke-agent/config/smoke-agent.yaml
          echo "scaffolder produces a complete project"

      - name: Build the enforcement service image
        run: |
          VERSION="$(cat deploy/VERSION)"
          docker build -f deploy/Dockerfile.service \
            --build-arg "SERVICE_VERSION=${VERSION}" \
            --build-arg "SERVICE_REVISION=${GITHUB_SHA::7}" \
            --build-arg "SERVICE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "galaxy-enforcement:${VERSION}" .
          echo "SERVICE_IMAGE=galaxy-enforcement:${VERSION}" >> "$GITHUB_ENV"

      - name: Image carries its notices and reports its version
        run: |
          # The image installs its dependencies, so it redistributes them and must
          # carry their license texts.
          docker run --rm --entrypoint ls "$SERVICE_IMAGE" \
            /app/LICENSE /app/NOTICE /app/THIRD_PARTY_NOTICES.md
          python - <<'PY'
          import json, os, subprocess, sys
          ref = os.environ["SERVICE_IMAGE"]
          declared = open("deploy/VERSION").read().strip()
          labels = json.loads(subprocess.run(
              ["docker", "image", "inspect", ref, "--format", "{{json .Config.Labels}}"],
              capture_output=True, text=True, check=True).stdout)
          got = labels.get("org.opencontainers.image.version")
          if got != declared:
              print(f"image version label is {got!r}, deploy/VERSION is {declared!r}")
              sys.exit(1)
          if labels.get("org.opencontainers.image.licenses") != "Apache-2.0":
              print("image is missing the Apache-2.0 license label"); sys.exit(1)
          # The running service must report the same version it was stamped with.
          reported = subprocess.run(
              ["docker", "run", "--rm", "--entrypoint", "python", ref, "-c",
               "from galaxy_gov.remote.server import service_version; print(service_version())"],
              capture_output=True, text=True, check=True).stdout.strip()
          if reported != declared:
              print(f"service reports {reported!r}, expected {declared!r}"); sys.exit(1)
          print(f"{ref}: version {declared} consistent across label, env, and /health")
          PY
